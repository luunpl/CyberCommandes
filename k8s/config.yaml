apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cybercommandes
data:
  DB_URL: jdbc:postgresql://postgres:5432/local
  DB_JPA_DDL_AUTO: update
---
# NOTE: this is a demo Secret with plain values for local clusters
# (minikube/kind). In a real environment use a sealed secret / external
# secret manager and never commit credentials.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: cybercommandes
type: Opaque
stringData:
  POSTGRES_DB: local
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DB_USERNAME: postgres
  DB_PASSWORD: postgres

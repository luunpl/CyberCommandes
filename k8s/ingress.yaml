# Requires an ingress controller (e.g. `minikube addons enable ingress`).
# Add "127.0.0.1 cybercommandes.local" to /etc/hosts when testing locally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybercommandes
  namespace: cybercommandes
spec:
  ingressClassName: nginx
  rules:
    - host: cybercommandes.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

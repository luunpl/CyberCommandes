apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cybercommandes

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: cybercommandes

# Pin the images you pushed from the CD pipeline here, e.g.:
#   kustomize edit set image ghcr.io/luunpl/cybercommandes-backend=ghcr.io/luunpl/cybercommandes-backend:sha-abc123
images:
  - name: ghcr.io/luunpl/cybercommandes-backend
    newTag: latest
  - name: ghcr.io/luunpl/cybercommandes-frontend
    newTag: latest

spring:
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/local}
  jpa:
    hibernate:
      ddl-auto:  ${DB_JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        # Expose health, info and Prometheus metrics for observability.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: cybercommandes